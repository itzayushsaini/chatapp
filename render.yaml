# Render "Blueprint": one web service that runs the whole app.
# Render reads this file when you choose New > Blueprint and pick this repo.
# See docs/DEPLOY.md for the step-by-step guide.
services:
  - type: web
    name: pingme
    runtime: node
    plan: free
    # Dev dependencies are needed to BUILD the client (Vite, Tailwind), so
    # include them even though NODE_ENV is production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    # Render checks this before switching traffic to a new deploy.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Paste your MongoDB Atlas connection string in the Render dashboard.
      # sync: false means it is never stored in this file.
      - key: MONGO_URI
        sync: false
      # Render generates a long random value once and keeps it.
      - key: JWT_SECRET
        generateValue: true
      # The in-memory MongoDB used by the tests would otherwise download a
      # ~600 MB binary during every build. Production never needs it.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      # Password-reset email (Brevo). Paste your API key and a sender email
      # verified in Brevo's dashboard. Leave blank and forgot-password still
      # answers normally, it just silently does not send anything.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        value: PingMe
      # MUST be this service's real public URL, or reset links point at
      # localhost. Render only knows the URL after the first deploy, so set
      # this once you see it (Render's dashboard shows it at the top of the
      # service page) - see docs/DEPLOY.md.
      - key: APP_URL
        sync: false
      # Optional "Continue with Google" - from Google Cloud Console (see
      # docs/DEPLOY.md section 1.6). Left blank, the button is not shown.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional PingMe AI - a Google Gemini API key from
      # https://aistudio.google.com/apikey (see docs/DEPLOY.md section 1.7).
      # Left blank, PingMe AI is not shown.
      - key: GEMINI_API_KEY
        sync: false
      # PORT is set by Render automatically; config/env.js reads it.
